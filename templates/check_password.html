{% extends "base.html" %}

{% block title %}Check Password{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/check_password.css') }}">
{% endblock %}

{% block content %}

<div class="password-container">

    <div class="password-card">

        <h1>Confirm Password</h1>

        <p>Enter your password to continue.</p>

        <form method="POST">

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Confirm
            </button>

        </form>

    </div>

</div>

{% endblock %}
