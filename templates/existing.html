{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}

<div class="login">

    <form method="POST">

        <h1>Login</h1>

        <br>

        <label for="email">Email</label>
        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email ID"
            required
        >

        <br><br>

        <label for="password">Password</label>
        <br>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <br><br>

        <button type="submit">Login</button>

        <br><br>

        <a href="{{ url_for('login') }}"
           class="existing-user-link" style="margin-left: 105px;text-decoration: none;">
            New user? Register
        </a>

    </form>

</div>

{% endblock %}
